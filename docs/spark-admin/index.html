<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Station Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:     #0d1b2a;
      --card:   #1a2e48;
      --card2:  #152336;
      --gold:   #f7c948;
      --teal:   #3dbfb0;
      --mint:   #7de8d0;
      --red:    #e8453c;
      --text:   #e8f0f8;
      --muted:  #8ca0b8;
      --border: #2a4060;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── PIN SCREEN ── */
    #scrPin {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #scrPin.active { display: flex; }

    .pin-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .pin-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .pin-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .pin-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    #pinInput {
      width: 100%;
      padding: 12px 14px;
      background: var(--card2);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      margin-bottom: 12px;
    }
    #pinInput:focus { border-color: var(--gold); }

    .btn-enter {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #1a1200;
      border: none;
      border-radius: 8px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-enter:hover { opacity: 0.9; }

    .pin-error {
      color: var(--red);
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 1.2em;
      margin-top: 4px;
    }

    /* ── DASHBOARD ── */
    #scrDash { min-height: 100vh; }

    .dash-header {
      background: rgba(13,27,42,0.95);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .dash-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: var(--gold);
    }
    .dash-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

    .btn-logout {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-logout:hover { color: var(--text); border-color: var(--muted); }

    .btn-refresh {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--teal);
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      margin-right: 8px;
    }
    .btn-refresh:hover { border-color: var(--teal); }

    .dash-body { padding: 24px; max-width: 1100px; margin: 0 auto; }

    /* ── STAT CARDS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--gold);
      line-height: 1.1;
      margin-top: 4px;
    }
    .stat-val.teal { color: var(--teal); }
    .stat-val.mint { color: var(--mint); }

    /* ── SECTION HEADINGS ── */
    .section-head {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── TWO COLUMNS ── */
    .two-col {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .two-col { grid-template-columns: 1fr; }
    }

    /* ── TOP TOPICS ── */
    .topics-list { display: flex; flex-direction: column; gap: 6px; }
    .topic-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .topic-rank {
      width: 22px;
      flex-shrink: 0;
      font-family: 'Fredoka One', cursive;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    .topic-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topic-bar-wrap {
      width: 60px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .topic-bar { height: 100%; background: var(--teal); border-radius: 3px; }
    .topic-count {
      width: 28px;
      text-align: right;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--teal);
    }

    /* ── RECENT TABLE ── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    thead th {
      background: var(--card2);
      padding: 10px 14px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    tbody tr { border-top: 1px solid var(--border); }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody td { padding: 9px 14px; vertical-align: middle; }
    .td-topic { font-weight: 700; max-width: 280px; word-break: break-word; }
    .td-time { color: var(--muted); white-space: nowrap; }
    .td-count { text-align: center; font-weight: 800; color: var(--mint); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
    }
    .badge-first { background: rgba(247,201,72,0.15); color: var(--gold); }
    .badge-more  { background: rgba(61,191,176,0.15); color: var(--teal); }

    /* ── LOADING / EMPTY ── */
    .loading-msg {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-weight: 700;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--red);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      z-index: 999;
      transition: transform 0.3s;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ═════════════════════════════════════════
       SCREEN 1: PIN GATE
  ═════════════════════════════════════════ -->
  <div id="scrPin" class="active">
    <div class="pin-card">
      <div class="pin-icon">&#9889;</div>
      <div class="pin-title">Spark Station Admin</div>
      <div class="pin-sub">Enter your PIN to continue</div>
      <input type="password" id="pinInput" placeholder="••••" maxlength="20"
             onkeydown="if(event.key==='Enter') checkPin()" />
      <div class="pin-error" id="pinError">&nbsp;</div>
      <button class="btn-enter" onclick="checkPin()">Enter</button>
    </div>
  </div>

  <!-- ═════════════════════════════════════════
       SCREEN 2: DASHBOARD
  ═════════════════════════════════════════ -->
  <div id="scrDash" class="screen">
    <div class="dash-header">
      <div>
        <div class="dash-title">&#9889; Spark Station Admin</div>
        <div class="dash-sub" id="lastUpdated">Loading&hellip;</div>
      </div>
      <div>
        <button class="btn-refresh" onclick="loadData()">&#8635; Refresh</button>
        <button class="btn-logout" onclick="logout()">Log Out</button>
      </div>
    </div>

    <div class="dash-body">

      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Searches</div>
          <div class="stat-val" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Today</div>
          <div class="stat-val teal" id="statToday">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Unique Topics</div>
          <div class="stat-val mint" id="statUnique">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">"More Ideas" Hits</div>
          <div class="stat-val" id="statMore" style="color:var(--muted)">—</div>
        </div>
      </div>

      <!-- TWO COLUMNS -->
      <div class="two-col">

        <!-- TOP TOPICS -->
        <div>
          <div class="section-head">Top Topics</div>
          <div class="topics-list" id="topicsList">
            <div class="loading-msg">Loading&hellip;</div>
          </div>
        </div>

        <!-- RECENT SEARCHES -->
        <div>
          <div class="section-head">Recent Searches <span style="color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:600">(last 200)</span></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Topic</th>
                  <th>Time</th>
                  <th style="text-align:center">Ideas</th>
                  <th>Type</th>
                </tr>
              </thead>
              <tbody id="logsBody">
                <tr><td colspan="4" class="loading-msg">Loading&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // CONFIG — fill in your Firebase API key below
    // ============================================================
    const FIREBASE_API_KEY = 'YOUR_FIREBASE_API_KEY_HERE';
    const PROJECT_ID       = 'bee-studio-c8d42';
    const COLLECTION       = 'spark_logs';

    // SHA-256 of your admin PIN (default PIN = "1234")
    // To change: run  sha256('yourNewPin')  in the browser console and paste the result here.
    const PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';

    // ============================================================
    // SHA-256 helper
    // ============================================================
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ============================================================
    // PIN CHECK
    // ============================================================
    async function checkPin() {
      const val = document.getElementById('pinInput').value;
      if (!val) return;

      const hash = await sha256(val);
      if (hash === PIN_HASH) {
        document.getElementById('scrPin').classList.remove('active');
        document.getElementById('scrDash').classList.add('active');
        loadData();
      } else {
        document.getElementById('pinError').textContent = 'Incorrect PIN';
        document.getElementById('pinInput').value = '';
        setTimeout(() => { document.getElementById('pinError').textContent = '\u00a0'; }, 2500);
      }
    }

    function logout() {
      document.getElementById('scrDash').classList.remove('active');
      document.getElementById('scrPin').classList.add('active');
      document.getElementById('pinInput').value = '';
    }

    // ============================================================
    // LOAD DATA FROM FIRESTORE
    // ============================================================
    async function loadData() {
      document.getElementById('lastUpdated').textContent = 'Loading\u2026';

      let docs;
      try {
        docs = await fetchLogs();
      } catch (err) {
        showToast('Failed to load data: ' + err.message);
        document.getElementById('lastUpdated').textContent = 'Error loading data';
        return;
      }

      renderStats(docs);
      renderTopics(docs);
      renderTable(docs);

      const now = new Date();
      document.getElementById('lastUpdated').textContent =
        'Last updated ' + now.toLocaleTimeString();
    }

    async function fetchLogs() {
      const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery?key=${FIREBASE_API_KEY}`;

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredQuery: {
            from: [{ collectionId: COLLECTION }],
            orderBy: [{ field: { fieldPath: 'ts' }, direction: 'DESCENDING' }],
            limit: 200,
          },
        }),
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const rows = await res.json();

      return rows
        .filter(r => r.document)
        .map(r => {
          const f = r.document.fields || {};
          return {
            topic:      f.topic?.stringValue      || '(unknown)',
            ts:         f.ts?.timestampValue       || '',
            ideasCount: parseInt(f.ideasCount?.integerValue || '0', 10),
            isMore:     f.isMore?.booleanValue     || false,
          };
        });
    }

    // ============================================================
    // RENDER
    // ============================================================
    function renderStats(docs) {
      const today = new Date().toISOString().slice(0, 10);
      const todayCount  = docs.filter(d => d.ts.startsWith(today)).length;
      const uniqueCount = new Set(docs.map(d => d.topic.toLowerCase().trim())).size;
      const moreCount   = docs.filter(d => d.isMore).length;

      document.getElementById('statTotal').textContent  = docs.length;
      document.getElementById('statToday').textContent  = todayCount;
      document.getElementById('statUnique').textContent = uniqueCount;
      document.getElementById('statMore').textContent   = moreCount;
    }

    function renderTopics(docs) {
      // Count by normalized topic
      const counts = {};
      docs.forEach(d => {
        const key = d.topic.toLowerCase().trim();
        counts[key] = (counts[key] || 0) + 1;
      });

      const sorted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15);

      const max = sorted[0]?.[1] || 1;
      const container = document.getElementById('topicsList');

      if (sorted.length === 0) {
        container.innerHTML = '<div class="loading-msg">No data yet</div>';
        return;
      }

      container.innerHTML = sorted.map(([topic, count], i) => `
        <div class="topic-row">
          <span class="topic-rank">${i + 1}</span>
          <span class="topic-name" title="${esc(topic)}">${esc(topic)}</span>
          <div class="topic-bar-wrap">
            <div class="topic-bar" style="width:${Math.round((count / max) * 100)}%"></div>
          </div>
          <span class="topic-count">${count}</span>
        </div>`
      ).join('');
    }

    function renderTable(docs) {
      const tbody = document.getElementById('logsBody');

      if (docs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="loading-msg">No searches yet</td></tr>';
        return;
      }

      tbody.innerHTML = docs.map(d => {
        const timeStr = d.ts ? fmtTime(d.ts) : '—';
        const badge = d.isMore
          ? '<span class="badge badge-more">More</span>'
          : '<span class="badge badge-first">First</span>';
        return `<tr>
          <td class="td-topic">${esc(d.topic)}</td>
          <td class="td-time">${timeStr}</td>
          <td class="td-count">${d.ideasCount}</td>
          <td>${badge}</td>
        </tr>`;
      }).join('');
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function fmtTime(isoStr) {
      try {
        const d = new Date(isoStr);
        const today = new Date();
        const isToday = d.toDateString() === today.toDateString();
        if (isToday) {
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
               d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch { return isoStr; }
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 5000);
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('pinInput').focus();
    });
  </script>
</body>
</html>
