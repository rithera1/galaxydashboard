<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Station — GalaxyDashboard</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       VARIABLES & RESET
    ============================================================ */
    :root {
      --bg:      #0d1b2a;
      --card:    #1a2e48;
      --card2:   #152336;
      --gold:    #f7c948;
      --spark:   #ffdd55;
      --teal:    #3dbfb0;
      --mint:    #7de8d0;
      --orange:  #ff9f43;
      --text:    #e8f0f8;
      --muted:   #8ca0b8;
      --border:  #2a4060;
      --radius:  14px;
      --shadow:  0 4px 20px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ============================================================
       STARS BACKGROUND
    ============================================================ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 42% 8%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 65%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 78%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 50%, rgba(247,201,72,0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       SCREENS
    ============================================================ */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px 40px;
      position: relative;
      z-index: 1;
    }
    .screen.active { display: flex; }

    /* ============================================================
       NAV BAR
    ============================================================ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(13,27,42,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      gap: 12px;
    }
    .nav-back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    /* ============================================================
       INPUT SCREEN
    ============================================================ */
    #scrInput { padding-top: 72px; }

    .spark-icon-big {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 8px;
      animation: pulse-glow 2.4s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(247,201,72,0.5)); transform: scale(1); }
      50%       { filter: drop-shadow(0 0 18px rgba(247,201,72,0.9)); transform: scale(1.08); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.4rem;
      color: var(--gold);
      letter-spacing: 1px;
      text-align: center;
    }

    .tagline {
      font-size: 1rem;
      color: var(--muted);
      margin: 6px 0 28px;
      text-align: center;
      font-weight: 600;
    }

    .input-wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
    }

    #topicInput {
      width: 100%;
      min-height: 110px;
      padding: 16px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
      -webkit-tap-highlight-color: transparent;
    }
    #topicInput::placeholder { color: var(--muted); font-weight: 600; }
    #topicInput:focus { border-color: var(--gold); }

    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 600;
    }
    .char-count.warn { color: var(--orange); }

    .btn-spark {
      margin-top: 20px;
      width: 100%;
      max-width: 520px;
      padding: 16px;
      background: var(--gold);
      color: #1a1200;
      border: none;
      border-radius: var(--radius);
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 0 4px 16px rgba(247,201,72,0.4);
    }
    .btn-spark:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(247,201,72,0.6);
    }
    .btn-spark:active { transform: translateY(0); }

    /* ============================================================
       LOADING SCREEN
    ============================================================ */
    .load-bolt {
      font-size: 3.5rem;
      animation: spin-bounce 1.8s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin-bounce {
      0%   { transform: scale(1) rotate(0deg); }
      30%  { transform: scale(1.2) rotate(-15deg); }
      60%  { transform: scale(0.9) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .load-msg {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: var(--gold);
      text-align: center;
      max-width: 300px;
      opacity: 1;
      transition: opacity 0.4s;
    }
    .load-msg.fade { opacity: 0; }

    .load-dots {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    .load-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--teal);
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .load-dots span:nth-child(2) { animation-delay: 0.2s; }
    .load-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40%            { transform: translateY(-10px); opacity: 1; }
    }

    /* ============================================================
       IDEAS SCREEN
    ============================================================ */
    #scrIdeas { padding-top: 72px; justify-content: flex-start; }

    .ideas-header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 560px;
      width: 100%;
    }
    .ideas-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--gold);
      line-height: 1.3;
    }
    .ideas-header .topic-pill {
      display: inline-block;
      background: rgba(247,201,72,0.15);
      border: 1px solid rgba(247,201,72,0.4);
      border-radius: 20px;
      padding: 2px 12px;
      color: var(--gold);
      font-weight: 800;
      font-size: 0.95rem;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .ideas-list {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .idea-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      animation: slide-in 0.3s ease both;
    }
    .idea-card:nth-child(1) { animation-delay: 0.05s; }
    .idea-card:nth-child(2) { animation-delay: 0.1s; }
    .idea-card:nth-child(3) { animation-delay: 0.15s; }
    .idea-card:nth-child(4) { animation-delay: 0.2s; }
    .idea-card:nth-child(5) { animation-delay: 0.25s; }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .idea-num {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--gold);
      color: #1a1200;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .idea-body { flex: 1; }

    .idea-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
      user-select: text;
    }

    .idea-ref {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--teal);
      font-weight: 600;
      font-style: italic;
    }
    .idea-ref:empty { display: none; }

    /* ============================================================
       BOTTOM BUTTONS
    ============================================================ */
    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 16px;
    }

    .btn-secondary {
      flex: 1;
      padding: 13px;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-secondary:hover { border-color: var(--muted); color: var(--gold); }

    .btn-more {
      flex: 2;
      padding: 13px;
      background: var(--teal);
      color: #0a1a14;
      border: none;
      border-radius: var(--radius);
      font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(61,191,176,0.35);
      letter-spacing: 0.5px;
    }
    .btn-more:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(61,191,176,0.5);
    }
    .btn-more:active { transform: translateY(0); }
    .btn-more:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ============================================================
       TOAST
    ============================================================ */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #c0392b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 999;
      transition: transform 0.3s;
      max-width: 90vw;
      text-align: center;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ============================================================
       MOBILE
    ============================================================ */
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .spark-icon-big { font-size: 3.2rem; }
      .btn-spark { font-size: 1.1rem; }
    }
    @media (max-height: 500px) {
      .spark-icon-big { display: none; }
      h1 { font-size: 1.6rem; }
      .tagline { margin: 4px 0 16px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="../" class="nav-back">&#8592; Home</a>
    <span class="nav-title">Spark Station</span>
  </nav>

  <!-- ===== SCREEN 1: INPUT ===== -->
  <div class="screen active" id="scrInput">
    <div class="spark-icon-big">&#9889;</div>
    <h1>Spark Station</h1>
    <p class="tagline">Type a topic &mdash; get fun ideas instantly!</p>

    <div class="input-wrap">
      <textarea
        id="topicInput"
        placeholder="What are you working on or curious about? Try: dinosaurs, the ocean, space travel, rainforests, volcanoes..."
        maxlength="300"
        rows="4"
        oninput="onType()"
        onkeydown="onKey(event)"
      ></textarea>
      <div class="char-count" id="charCount">0 / 300</div>
    </div>

    <button class="btn-spark" onclick="getIdeas()">&#9889; Spark Ideas!</button>
  </div>

  <!-- ===== SCREEN 2: LOADING ===== -->
  <div class="screen" id="scrLoading">
    <div class="load-bolt">&#9889;</div>
    <div class="load-msg" id="loadMsg">Searching the galaxy for ideas&hellip;</div>
    <div class="load-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- ===== SCREEN 3: IDEAS ===== -->
  <div class="screen" id="scrIdeas">
    <div class="ideas-header">
      <h2>Ideas about: <span class="topic-pill" id="topicPill"></span></h2>
    </div>

    <div class="ideas-list" id="ideasList"></div>

    <div class="btn-row">
      <button class="btn-secondary" onclick="newTopic()">&#8592; New Topic</button>
      <button class="btn-more" id="btnMore" onclick="moreIdeas()">&#9889; More Ideas</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WORKER_URL = 'https://stellar-stories-api.dadinorbit.workers.dev';

    // ============================================================
    // STATE
    // ============================================================
    let currentTopic = '';
    let currentIdeas = [];   // array of idea text strings shown so far in this session
    let loadMsgTimer = null;

    // ============================================================
    // LOADING MESSAGES
    // ============================================================
    const LOAD_MSGS = [
      'Searching the galaxy for ideas\u2026',
      'Checking the science books\u2026',
      'Asking the robot brain\u2026',
      'Connecting to the idea cloud\u2026',
      'Double-checking the facts\u2026',
      'Almost ready\u2026',
    ];

    function startLoadMsgs() {
      let idx = 0;
      const el = document.getElementById('loadMsg');
      el.textContent = LOAD_MSGS[0];

      loadMsgTimer = setInterval(() => {
        el.classList.add('fade');
        setTimeout(() => {
          idx = (idx + 1) % LOAD_MSGS.length;
          el.textContent = LOAD_MSGS[idx];
          el.classList.remove('fade');
        }, 400);
      }, 3200);
    }

    function stopLoadMsgs() {
      clearInterval(loadMsgTimer);
      loadMsgTimer = null;
    }

    // ============================================================
    // SCREEN SWITCHING
    // ============================================================
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // CHAR COUNT
    // ============================================================
    function onType() {
      const val = document.getElementById('topicInput').value;
      const el = document.getElementById('charCount');
      el.textContent = val.length + ' / 300';
      el.classList.toggle('warn', val.length >= 260);
    }

    function onKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        getIdeas();
      }
    }

    // ============================================================
    // FETCH IDEAS
    // ============================================================
    async function getIdeas(isMore = false) {
      const topic = isMore ? currentTopic : document.getElementById('topicInput').value.trim();

      if (topic.length < 3) {
        showToast('Please type at least a few words about your topic!');
        return;
      }

      currentTopic = topic;

      // Disable more button while loading
      const btnMore = document.getElementById('btnMore');
      if (btnMore) btnMore.disabled = true;

      show('scrLoading');
      startLoadMsgs();

      let data;
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            game: 'spark-station',
            topic,
            previousIdeas: isMore ? currentIdeas : [],
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Server error');
        }

        data = await res.json();
      } catch (err) {
        stopLoadMsgs();
        show(isMore ? 'scrIdeas' : 'scrInput');
        if (btnMore) btnMore.disabled = false;
        showToast(err.message || 'Something went wrong. Please try again!');
        return;
      }

      stopLoadMsgs();

      // Track ideas so "More Ideas" can get different ones
      if (!isMore) currentIdeas = [];
      (data.ideas || []).forEach(i => currentIdeas.push(i.text));

      renderIdeas(data.ideas || [], topic);
      if (btnMore) btnMore.disabled = false;
      show('scrIdeas');
    }

    // ============================================================
    // RENDER IDEAS
    // ============================================================
    function renderIdeas(ideas, topic) {
      document.getElementById('topicPill').textContent = topic;

      const list = document.getElementById('ideasList');
      list.innerHTML = '';

      ideas.forEach((idea, i) => {
        const card = document.createElement('div');
        card.className = 'idea-card';
        card.innerHTML =
          '<div class="idea-num">' + (i + 1) + '</div>' +
          '<div class="idea-body">' +
            '<div class="idea-text">' + esc(idea.text) + '</div>' +
            '<div class="idea-ref">' + esc(idea.ref || '') + '</div>' +
          '</div>';
        list.appendChild(card);
      });
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    function newTopic() {
      currentTopic = '';
      currentIdeas = [];
      document.getElementById('topicInput').value = '';
      document.getElementById('charCount').textContent = '0 / 300';
      show('scrInput');
      setTimeout(() => document.getElementById('topicInput').focus(), 300);
    }

    function moreIdeas() {
      getIdeas(true);
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 5000);
    }

    // ============================================================
    // XSS ESCAPE
    // ============================================================
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('topicInput').focus();
    });
  </script>
</body>
</html>
